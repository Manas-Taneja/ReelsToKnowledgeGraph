    <h1>From a saved reel to a linked knowledge base</h1>
    <svg viewBox="0 0 1280 920" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="light-title light-desc">
      <title id="light-title">From a saved reel to a linked knowledge base</title>
      <desc id="light-desc">Pipeline diagram. A Meta export of saved Instagram posts enters rkb import. A dashed accent boundary marks the stage that runs entirely on your machine with no API and no quota: yt-dlp or gallery-dl fetches the media, ffmpeg samples eight keyframes, mlx-whisper transcribes the audio and Apple Vision reads the on-screen text. That stage emits one context.md folder per post. A second boundary marks the extraction stage, where Claude Code reads context.md and rkb record verifies every URL before storing it. Results land in SQLite with a full-text index, which feeds three outputs: rkb search, rkb triage for the review queue, and rkb vault for Obsidian, which in turn feeds rkb graph.</desc>
