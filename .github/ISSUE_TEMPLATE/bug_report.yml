name: Bug report
description: Something behaved differently from what it says it does
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran and what came back. Paste the output.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: input
    id: stage
    attributes:
      label: Which stage
      placeholder: import / prepare / ocr / record / triage / vault / graph / dashboard
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: macOS version, chip, Python version, and Obsidian version if the vault is involved.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you post
      options:
        - label: I've checked the pasted output for post URLs, captions or anything else from my own library that I'd rather not publish.
          required: true
