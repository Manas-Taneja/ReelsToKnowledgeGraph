name: Feature request
description: Something the tool should do and doesn't
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation, not the solution — what you were doing when the tool got in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
